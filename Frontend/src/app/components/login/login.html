<div class="container d-flex justify-content-center align-items-center pt-5">
  <div class="card shadow-lg border-0 rounded-4 overflow-hidden" style="max-width: 900px; width: 100%;">
    <div class="row g-0">
      <div class="col-md-6 d-none d-md-block ">
        <img src="/images/login.png" class="img-fluid h-100 w-100" style="object-fit: cover;" alt="Vantage Workspace">
      </div>
      
      <div class="col-md-6 p-5">
        <h3 class="fw-bold mb-2">Welcome Back</h3>
        <p class="text-muted mb-4">Enter your details to access your workspace.</p>
        
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" 
      class="p-4 bg-white shadow-sm rounded-4 border border-light">
  
  <div class="mb-3">
    <label class="form-label fw-bold text-muted small">Email Address</label>
    <input 
      type="email" 
      formControlName="email" 
      class="form-control form-control rounded-3 border-0 bg-light"
      placeholder="name@example.com"
      [class.is-invalid]="loginForm.controls.email.touched && loginForm.controls.email.invalid"
    >
    @if (loginForm.controls.email.touched && loginForm.controls.email.errors?.['email']) {
      <div class="text-danger small mt-1">Please enter a valid email address.</div>
    }
  </div>

  <div class="mb-4">
    <label class="form-label fw-bold text-muted small">Password</label>
    <input 
      type="password" 
      formControlName="password" 
      class="form-control form-control rounded-3 border-0 bg-light"
      placeholder="••••••••"
      [class.is-invalid]="loginForm.controls.password.touched && loginForm.controls.password.invalid"
    >
  </div>

  <button type="submit" [disabled]="loginForm.invalid" class="btn btn-primary btn-lg w-100 rounded-3 fw-bold shadow-sm">
    Login
  </button>
</form>
          <div class="register-redirect">
           <span class="redirect-text">Don't have an account?</span>
           <a routerLink="/register" class="redirect-link">Register now</a>
         </div>
      </div>
    </div>
  </div>
</div>
