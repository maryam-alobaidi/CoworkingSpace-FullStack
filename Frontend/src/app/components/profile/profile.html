<div class="container-fluid min-vh-40 d-flex align-items-center justify-content-center pt-2 pb-3">
  <div class="row w-100 justify-content-center">
    <div class="col-md-6 col-lg-4">


<div class="card infoCard shadow border-0 rounded-5 p-4 text-light">
  <div class="text-center mb-4">
    <div class="rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3"
         [style.backgroundColor]="userColor"
         style="width: 110px; height: 110px; border: 4px solid rgba(16, 16, 214, 0.3);">
         <i class="fa-solid fa-user fa-3x"></i>
    </div>
    <h3 class="fw-bold text-white">{{ userInfo()?.fullName }}</h3>
    <span class="badge bg-primary bg-opacity-25 text-primary px-3 rounded-pill">Member</span>
  </div>

  <div class="px-2 mt-4">
    <div class="d-flex align-items-center mb-4">
      <div class="icon-container me-3"><i class="fa-solid fa-envelope text-primary"></i></div>
      <div>
        <small class="text-dark d-block">Email Address</small>
        <span class="fw-semibold text-secondary">{{ userInfo()?.email }}</span>
      </div>
    </div>

    <div class="d-flex align-items-center">
      <div class="icon-container me-3"><i class="fa-solid fa-phone text-primary"></i></div>
      <div>
        <small class="text-dark d-block">Phone Number</small>
        <span class="fw-semibold text-secondary">{{ userInfo()?.phoneNumber || 'Not provided' }}</span>
      </div>
    </div>
  </div>

  <div class="mt-4 pt-3 d-grid">
    <button class="btn btn-outline-primary rounded-pill py-2" routerLink="/edit-profile">
      Edit Account
    </button>
  </div>
</div>
    </div>
    </div>
  </div>
