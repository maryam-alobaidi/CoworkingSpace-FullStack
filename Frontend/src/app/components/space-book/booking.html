<div class="container my-5">
    @if(bookSpace()){
        <div class="row ">

            <div class="col-md-6 card border-0 shadow-sm p-3 bg-white rounded-4">
                <img [src]="bookSpace()?.imageUrl" class="img-fluid rounded-3 mb-3" alt="Workspace Image" style="max-height: 400px;object-fit: cover;">
                <h3 class="fw-bold text-dark">{{bookSpace()?.title}}</h3>
                <p class="text-muted mb-2"><i class="fa-solid fa-layer-group me-1"></i>{{bookSpace()?.spaceType}}</p>
                <h4 class="text-primary fw-bold">${{bookSpace()?.pricePerHour}}/hr</h4>
            </div>

            <div class="col-md-6 card border-0 shadow-sm p-4 text-white rounded-4 booking-time">
                <h4 class="fw-bold mb-4 text-white">Select Date & Time Slots</h4>
                
                <div class="mb-4">
                    <label for="bookingDate" class="form-label text-light fw-semibold small">1. Choose Date</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-white"><i class="fa-solid fa-calendar-days"></i></span>
                        <input 
                            type="date" 
                            id="bookingDate" 
                            class="form-control bg-dark text-white border-secondary date-picker-input" 
                            [ngModel]="selectedDate()" 
                            (ngModelChange)="onDateChange($event)">
                    </div>
                </div>

                <hr class="border-secondary my-4">

                <div class="time-slots-container">
                    <label class="form-label text-light fw-semibold small mb-3">2. Available Hourly Slots for ({{ selectedDate() }})</label>
                    <div class="d-flex flex-wrap gap-2">
                        @for(slot of allSlots(); track slot){
                         <button
                            type="button"
                            class="btn rounded-pill px-3 py-2 time-chip"
                            [class.slot-booked]="isSlotBooked(slot)"
                            [class.slot-past]="isSlotInPast(slot)" [class.slot-selected]="isSlotSelected(slot) && !isSlotBooked(slot) && !isSlotInPast(slot)" [class.slot-available]="!isSlotSelected(slot) && !isSlotBooked(slot) && !isSlotInPast(slot)"
                            [disabled]="isSlotBooked(slot) || isSlotInPast(slot)" (click)="selectSlot(slot)">
                            
                            {{slot}}
                            
                            @if(isSlotBooked(slot)){
                                <span class="badge bg-secondary ms-1">Reserved</span>
                            }
                            @if(isSlotInPast(slot)){
                                <span class="badge bg-danger bg-opacity-25 text-danger ms-1" style="font-size: 10px;">Past</span> }
                         </button>
                        }
                    </div>
                </div>

                <button 
                    class="btn btn-primary w-100 rounded-4 py-2.5 fw-bold mt-4" 
                    [disabled]="selectedSlots().length === 0" 
                    (click)="confirmBooking()">
                    Confirm Booking ({{ selectedSlots().length }} Selected)
                </button>
            </div>

        </div>
    }@else {
        <div class="text-center my-5">
            <div class="spinner-border my-5 text-primary"></div>
            <p class="text-muted mt-2">Loading workspace details...</p>
        </div>
    }
</div>
